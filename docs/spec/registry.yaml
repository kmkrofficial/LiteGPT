  - id: EXP-M1-TOKENIZER
    milestone: M1
    hypothesis: "A 32,768-entry byte-level BPE trained on the stable mixture (code in the F1 split) satisfies the hard requirements and compresses no worse than 0.90x GPT-2 on the stable mixture."
    config: scripts/train_tokenizer.py + litegpt/tokenizer.py (litegpt/assets/tokenizer/litegpt-32k.json)
    parent: EXP-M1-SOURCES
    status: frozen
    runs:
      - 20261011T142237Z-data-tokenizer-trial-076712e   # 0.5 GB memory trial (4.4 GiB peak)
      - 20261011T142732Z-data-tokenizer-trial-076712e   # 1.5 GB memory trial (6.0 GiB peak)
      - 20261011T143457Z-data-tokenizer-train-076712e   # candidate, 5.0 GB, sha256 2f208b58...
      - 20261011T145740Z-data-tokenizer-check-076712e   # data-free checks re-run with the corrected check code
    thresholds:   # PRE-REGISTERED 2026-10-11 before any tokenizer was trained
      hard: ["byte-exact round trip on 100% of validation documents in every domain", "vocabulary size exactly 32768",
             "the 37 special tokens are atomic with fixed ids 0-36", "literal special-token text in documents never produces a special id",
             "digits are always single tokens", "4 spaces, a tab and a newline-plus-indent are encoded without byte fallback explosion (<= 2 tokens each)"]
      sanity: "overall bytes/token on the stable mixture >= 0.90 x GPT-2's; per-domain and per-language ratios are informational; failure triggers an investigation, nothing is adopted automatically"
      training: "3-5 GB from training partitions only, largest size whose projected peak RAM <= 20 GiB (WSL has 23 GiB)"
    clarifications:   # recorded 2026-10-11 BEFORE the tokenizer was trained
      - "Round trip: the tokenizer applies NFC normalisation (as Qwen2 does), so the criterion is decode(encode(text)) == NFC(text) on 100% of validation documents; the fraction of documents altered by NFC is reported."
      - "Bytes-per-token comparisons use the same validation documents for every tokenizer; GPT-2 and SmolLM2 are loaded from their tokenizer files only (no model is run)."
      - "Checks run on the tokenizer's own held-out documents: the val partition (u < val_fraction) of the downloaded training-sample files, never on documents used to train the tokenizer."
    protocol_corrections:   # recorded after the candidate was trained; criteria unchanged
      - date: 2026-10-11
        run: 20261011T143457Z-data-tokenizer-train-076712e
        defect: "Two implementation defects in the check code, not in the tokenizer: (1) the digit check compared the token count of '0123456789 2024' with 14 although the space between the numbers is one more token, so it reported false; (2) the whitespace check included a trailing letter ('newline + 4 spaces + x' is 3 tokens) while the pre-registered criterion is about whitespace-only strings (<= 2 tokens)."
        correction: "digits_single now checks that every digit of every maximal digit run in nine varied strings is exactly one token; whitespace is measured on whitespace-only strings with the registered limit of 2. The same tokenizer file (sha256 2f208b58...) was re-checked with scripts/train_tokenizer.py check."
    conclusion: "CANDIDATE (not frozen; owner approval pending at Checkpoint B). Trained on 4.996 GB (1,053,405 documents) of stable-partition text at the stable mixture weights (3 FineWeb-Edu, 2 Cosmopedia, 2 FineMath, 24 code files; each file contributes an equal share), 354 s, peak RSS 9.5 GiB (the two trials predicted ~11 GiB). sha256 2f208b58085074d9520d737332f8da9fb8c8a8718479978bbe8afb5b4ea015d6. Hard checks: vocabulary 32,768 and special ids 0-36 as specified: PASS; byte-exact round trip (against the NFC form) on 100% of 6,770 held-out validation documents in all 8 domains: PASS (NFC altered only 5 documents: 3 math, 2 JavaScript); literal special-token text never produces a control id: PASS; digits single tokens (after the check correction above): PASS; whitespace-only strings (4 spaces, tab, newline+indent, 8 spaces) encode in 1-2 tokens: PASS. Sanity bound: web bytes/token 4.457 vs GPT-2 4.616 = 0.966x (>= 0.90): PASS. Compression (bytes/token, higher is better; LiteGPT / GPT-2 / SmolLM2): web 4.457/4.616/4.527; synthetic 5.227/5.149/5.239; math 3.491/3.579/3.329; Python 3.786/2.188/3.517; JavaScript 2.643/1.897/2.474; TypeScript 3.891/2.429/3.620; Shell 2.819/2.361/2.627; SQL 3.001/2.561/2.596. Held-out sample sizes are small for some code languages (SQL 33, TypeScript 126, Shell 143, Python 353 documents), so per-language ratios are indicative only. FROZEN 2026-10-11 by the owner after reviewing the results and the vocabulary trade-off (32,768 kept; a 49,152 vocabulary would gain ~1.5-2% web bytes/token for +12.6M parameters and ~+4% FLOPs per token). Installed as litegpt/assets/tokenizer/litegpt-32k.json; sha256 recorded in docs/spec/v2.yaml (tokenizer.sha256)."
