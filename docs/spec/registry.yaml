be hit the local cache at 921 MB/s and is not representative; the 25 MB/s figure is used), projected ~125 GB of downloads, about 1.4 hours; free space C: 277 GB, WSL disk limit not binding, headroom after 41 GB of shards and temporaries 236 GB. C7 PASS: all 18 benchmarks resolve at pinned revisions (XSTest via the ungated copy Paul/XSTest, 450 prompts; the gated walledai/XSTest was not used), 1,612,644 unique 13-grams in total. OWNER DECISION PENDING: C5 (see docs/data_licenses.md). OWNER DECISION (2026-10-11, in chat): C5 is not treated as a blocker; F8 stands (the 5% instruction slice uses smol-summarize, smol-rewrite and smol-constraints). The Qwen display clause stays in docs/data_licenses.md as an item carried to the M5 release gate (not dismissed: it is recorded so that the model card and naming can be handled there). C9 RE-PLAN WITH THE REAL TOKENIZER (2026-10-11, from the candidate's bytes/token vs GPT-2 on the same documents; real tokens = proxy tokens x GPT-2 bytes-per-token / LiteGPT bytes-per-token): web x1.036, Cosmopedia x0.985, math x1.025, Python x0.578, JavaScript x0.718, TypeScript x0.624, Shell x0.838, SQL x0.853. Code supply in real tokens over files 0-222: Python 1.55B (need 1.25B incl. 3% margin, 1.24x), JavaScript 2.28B (8.2x), TypeScript 0.42B (1.5x), Shell 0.13B (1.35x), SQL 0.078B vs 0.079B (0.98x: BELOW the 1.05x rule). Pre-registered rule applied: the fixed list is extended to files 0-261 (262 files, SQL margin 1.15x at its 4% weight; within the 300-file cap), ~93 GB of code downloads. Repository-level code decay fraction raised from 0.026 to 0.08 so that the scarcest language (SQL) still receives its decay tokens (other languages end up with surplus decay tokens that the index does not use), keep fractions re-derived (Python 0.80, JavaScript 0.15, TypeScript 0.75, Shell 0.80, SQL 1.00; they only bound disk use). Web, Cosmopedia and math pass without change (1.31x / 1.29x / 1.18x stable, 1.14x / 1.6x / 1.25x decay). The instruction slice 