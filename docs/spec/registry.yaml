    thresholds:
      rule: "a document is dropped if it shares any 13-gram (lowercased word tokens) with a reference set; reference sets are the 18 benchmarks pinned by C7"
      audit: "if one benchmark accounts for > 0.5% of a source's dropped tokens, audit its n-gram set for boilerplate (very short or generic prompts) and record the outcome before training"
      records: "dropped documents and tokens per source x benchmark with sample matches"
    protocol_corrections:   # recorded BEFORE the corrected index is built and before the full preparation run
      - date: 2026-10-11
        run: 20261011T172128Z-data-decontam-audit-math-203de2f
        finding: "Dry run (2 files per source): decontamination dropped ~4.2% of FineMath bytes (humaneval 2,359 documents, mbpp 1,021), triggering the 0.5% audit rule; FineWeb-Edu 0.37%, Cosmopedia 0.04%, code < 0.2%. The audit of FineMath file 0 shows the matches are generic sequences from benchmark test cases, not benchmark text: '0 0 0 ... 0' (3,240 windows), '1 2 3 ... 13' and its shifts (~5,600), lists of primes, 'a b c ... m', '000 000 ...' (TriviaQA). These carry no item-specific content and occur naturally in math pages."
        correction: "Reference 13-grams whose 13 words are all numbers or single characters are excluded when the index is built (litegpt/decontam.py, window_hashes(skip_trivial=True); test added). Windows containing any real word are unchanged, so genuine benchmark text is still caught. The index is rebuilt, the audit is re-run on FineMath and FineWeb-Edu, and the full preparation runs in a new run directory with the corrected index (the dry-run shards are discarded; its record is kept)."
    conclusion: "Re-audit with the corrected index (records *data-decontam-audit-math* and *data-decontam-audit-fineweb_edu* of 2026-10-11): FineMath file 0 drops 0.27% of bytes (150 of 167,232 documents), FineWeb-Edu file 0 (first 200,000 documents) 0.29% (154 documents); both below the 0.5% audit rule. Remaining matches are mostly quoted public texts that also appear in benchmark items (Declaration of Independence and US Constitution passages in MMLU; the Gettysburg Address in TriviaQA) and a few code idioms; these documents are dropped as planned (conservative). Final per-source drop rates come from the full preparation run."
