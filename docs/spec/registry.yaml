    decisions:   # PRE-REGISTERED 2026-10-11 before any pre-flight check ran (owner-approved plan rev 2)
      F1_code_languages: {Python: 0.62, JavaScript: 0.14, TypeScript: 0.14, SQL: 0.05, Shell: 0.05, unit: "fraction of code tokens, stable and decay", others: dropped}
