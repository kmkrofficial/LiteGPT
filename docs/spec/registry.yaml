      efficiency: "bf16 GPU; prompt 128/512 x output 128 x batch 1/8; prefill tok/s, decode tok/s, bytes/s, time to first token, peak VRAM"
      protocol: "seed 1234; greedy; bf16; sample-level outputs saved; task dataset revisions pinned to docs/spec/data_sources.yaml references where shared; no limit except the registered TriviaQA subset; no trust_remote_code; generated code executed only in WSL2 in a separate process with timeout, memory limit and no network"
      deferred_to_M4: ["Spider execution accuracy (databases outside the Hub)", "MultiPL-E JS/TS execution (needs Node.js/TypeScript installed by the owner)"]
    thresholds:
      harness_sanity: "GPT-2 124M base suite: hellaswag acc_norm in [0.29, 0.33] and piqa acc in [0.61, 0.65]; otherwise no baseline is published until the setup is fixed"
      determinism: "the same model run twice gives identical scores on every task"
      adapter: "native LiteGPT adapter log-likelihoods equal direct model log-probabilities on litegpt-tiny (abs diff <= 1e-4 in fp32)"
    protocol_corrections:   # recorded 2026-10-12 BEFORE the affected models were scored again
      - date: 2026-10-12
        finding: "Qwen/Qwen2.5-0.5B and Qwen/Qwen3-0.6B-Base ship a generation_config with max_new_tokens=2048, which transformers lets override lm-eval's max_length; the code tasks therefore generated up to 2,048 tokens instead of the registered 512, the GPU ran out of memory and spilled into shared memory (WDDM, also under WSL2), and the Qwen2.5-0.5B base run stalled on HumanEval for 6 hours (stopped, discarded). Every other model has no such setting: the 8 finished base runs logged zero override warnings and are unaffected."
        correction: "Every generative group now passes max_new_tokens explicitly, equal to lm-eval's effective max_gen_toks (TriviaQA 256, GSM8K 256, GSM8K chat 256, HumanEval / MBPP and their instruct versions 512, IFEval 1280), so a model's own generation_config cannot override it; for models without such a setting this is identical to what already ran. The evaluation process caps its CUDA allocator at free VRAM minus 1 GiB, so an overflow fails visibly instead of spilling."
      - date: 2026-10-12
        finding: "With the VRAM cap in place, Qwen2.5-0.5B (151,936-token vocabulary) at batch 16 fails with an out-of-memory error on the first log-likelihood batch (a 4.3 GiB logits allocation); without the cap the same overflow had silently spilled into shared memory."
        correction: "Batch size stays 16; if a group exceeds the VRAM cap it is retried with the batch halved (8, 4, 2, 1) and the batch size actually used is recorded per group (eval/<group>.json). Batch size changes only speed and bf16 rounding, not the task protocol."
      - date: 2026-10-12
        finding: "The first correction did not work: lm-eval 0.4.13 normalises max_new_tokens into its own max_gen_toks and does not pass it to generate(), so the Qwen2.5-0.5B rerun still generated with the model's max_new_tokens=2048 (seen in the transformers warning during TriviaQA; run stopped and discarded)."
        correction: "Models whose generation_config.json sets max_new_tokens or max_length (Qwen2.5-0.5B, Qwen3-0.6B-Base) are evaluated from a local copy of the pinned snapshot with those keys removed, so lm-eval's limits apply exactly as for every other model; the removed values are recorded in each run's run.json (generation_config_removed). The explicit max_new_tokens entries in suite_v0.yaml are kept only as documentation (lm-eval treats them as aliases of max_gen_toks)."
      - date: 2026-10-12
        finding: "Before any instruct score: (1) IFEval failed to import (langdetect missing; lm-eval's ifeval extra was not in the eval dependency group). (2) suite_v0.yaml gave IFEval lm-eval's task default of 1,280 new tokens (written down explicitly by the first correction above), which contradicts the pre-registered instruct suite ('max 512 new tokens') and is longer than V1-Instruct's whole 1,024-token context, so lm-eval refused to run it."
        correction: "The eval group installs lm-eval[ifeval]==0.4.13. IFEval generates at most 512 new tokens for every model, as registered; every instruct group is now within the 512 cap. No instruct result existed when this was changed (the aborted instruct records contain no scores and are not used). Suite version stays 0.1.0: the base suite is unchanged and the instruct suite now matches its registration."
      - date: 2026-10-12
        finding: "XSTest generated at most 128 new tokens (litegpt.eval.native's default, shared with the efficiency benchmark) instead of the suite's 256; found after the V1-Instruct XSTest record (20261012T152911Z) and before any other model's XSTest."
        correction: "XSTest takes its length from suite_v0.yaml (256); the efficiency benchmark keeps its registered 128. V1-Instruct's XSTest is re-run at 256 and the 128-token record is superseded (kept, not reported). The refusal classifier reads the first 400 characters, so the effect is expected to be small; both V1 numbers are compared in the conclusion."
      - date: 2026-10-12
        finding: "The GSM8K chat headline (gsm8k_cot_zeroshot, registered as 'exact_match') was read from lm-eval's first filter, strict-match, which only accepts the phrase 'The answer is N.'; the zero-shot chat prompt never asks for that phrase, so strict-match was 0.000 for every chat model (V1-Instruct, SmolLM2-135M/360M-Instruct, Gemma 3 270M-it), independent of the answers. Found while checking the first four instruct records."
        correction: "The headline for gsm8k_cot_zeroshot is exact_match with lm-eval's flexible-extract filter (last number in the answer), written explicitly in suite_v0.yaml as 'exact_match,flexible-extract'; base GSM8K is written explicitly as 'exact_match,strict-match' (unchanged: the 5-shot answers follow the '#### N' format of the shots). Every record already contains both filters, so nothing is re-run; the report computes each headline from the per-group results with the suite's metric choice. The choice is forced by the zero floor, not by which model it favours; strict-match values stay in the records."
      - date: 2026-10-12
        finding: "Both chat code tasks of lm-eval 0.4.13 mis-score correct answers. humaneval_instruct stops generation at '\\ndef' (and '\\n#', '\\nif', '\\nclass', '\\nprint'), so a model that restates the whole function after the pre-filled signature is cut to an empty answer (SmolLM2-135M-Instruct 164/164 empty, SmolLM2-360M-Instruct 158/164, V1-Instruct 93/164, Gemma 3 270M-it 0/164). mbpp_instruct's extractor prepends '```' to the answer and reads a leading 'def' as the code block's language tag, deleting it (SmolLM2 500/500 answers affected, Gemma 0/500). The effect is model-specific: SmolLM2 scored 0 on both while Gemma was unaffected. Found by inspecting the four finished instruct records' samples."
        correction: "Suite 0.1.1: code_chat uses corrected copies, litegpt/eval/tasks/code_chat (humaneval_instruct_litegpt, mbpp_instruct_litegpt) with lm-eval's prompts, prefixes, datasets, metrics and 0-shot setting unchanged; HumanEval has no stop strings (the prompt plus the answer's code up to its closing fence is executed, so a restated function redefines the stub), and both tasks take the code before the closing fence after dropping a re-opened fence line. Every other group is identical to 0.1.0, so those results stand. The code_chat group is re-run for all six instruct models; the 0.1.0 code_chat results are superseded (kept, not reported). Owner-approved 2026-10-12. Smoke check on the first 20 problems (non-comparable): SmolLM2-360M-Instruct HumanEval 0.00 -> 0.10, MBPP 0.00 -> 0.35; Gemma 3 270M-it unchanged (0.40 / 0.25 before and after)."
    clarifications:   # recorded 2026-10-11 BEFORE the first score
      - "Task dataset revisions: lm-eval 0.4.13 loads each task's dataset at its latest revision and has no per-task revision option without forking task configs. The resolved Hub commit of every task dataset is therefore recorded in each run (eval/summary.json, task_dataset_revisions) and compared with the decontamination pins; a mismatch is flagged in the report, and baselines are re-run if a task dataset changes between models."
      - "MMLU is scored with lm-eval's mmlu_continuation (cloze) group; the code tasks are humaneval (0-shot) and mbpp (3-shot) for base models, humaneval_instruct / mbpp_instruct for chat models; gsm8k_cot_zeroshot is the chat GSM8K task; XSTest is scored natively (not in lm-eval 0.4.13)."
      - "TriviaQA subset: 2,000 document indices drawn with random.Random(1234).sample over the task's evaluation split, passed to lm-eval as `samples`."
      - "Code tasks (humaneval, mbpp, humaneval_instruct, mbpp_instruct) generate at most 512 new tokens for every model (lm-eval default 1,024 equals GPT-2's whole context and aborted the first GPT-2 run before any code score was produced; recorded 2026-10-11 before any code-task score)."
    conclusion: "HARNESS VALIDATED (2026-10-11, Checkpoint C). Sanity rule PASS: GPT-2 124M HellaSwag acc_norm 0.3130 (range 0.29-0.33), PIQA acc 0.6246 (range 0.61-0.65); other GPT-2 scores: ARC-Easy 0.4407, ARC-Challenge acc_norm 0.2210, OpenBookQA acc_norm 0.268, CommonsenseQA 0.1957, Winogrande 0.5083, MMLU (continuation) 0.2535, TruthfulQA MC1 0.2301 / MC2 0.4068, TriviaQA (2,000) 0.017, GSM8K strict 0.0061, HumanEval pass@1 0.0, MBPP pass@1 0.0. Determinism rule PASS: two independent runs give identical results for every task, and identical per-sample outputs for HumanEval (164) and MBPP (500). Adapter rule PASS (tests/test_eval_adapter.py). Fixes before the baselines: code tasks capped at 512 new tokens (recorded clarification); task dataset revisions were not being recorded (a falsy TaskConfig check), fixed and verified (humaneval 7dce6050, hellaswag 218ec52e: equal to the decontamination pins). GPT-2 is re-run as a single complete record in the baseline set. FINAL (2026-10-13): suite 0.1.1 after the protocol corrections above, each recorded before the affected scores were final; base groups are identical to 0.1.0, so every base record stands. Baseline results: EXP-M1B-BASELINES."
