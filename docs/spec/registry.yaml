      implementation: "litegpt/training/sft.py, benchmarks/m4/sft.yaml: linear warm-up then cosine to 10%; weight decay 0.1, betas 0.9 and 0.95, gradient clip 1.0 as M3; layouts compared in speed_check_result"
      speed_check_result: "2026-11-03, real packed steps on the rented A100 (m:59466, PCIe, 40 GB, $0.341/h): 46.7k tok/s compiled SDPA with the mask, below the 55k stop, so it stopped and reported before the sweep. Same host: plain M3-style rows 81.8k, so the host is fine and the block-diagonal mask is the cost; repeat of the mask at micro-batch 16 48.1k, at 8 46.5k; eager SDPA at 8 34.2k; flash with cu_seqlens at 8 50.8k, at 4 47.9k, at 16 out of memory. Flash and mask agree on the same batch to 3e-05 and 1.3e-04. OWNER DECISION 2026-11-03: continue below the line with flash at micro-batch 8, no compile. The line was set to protect the budget at up to $0.50/h; at $0.341/h about 20 h costs about $6.75 (estimate), under the $9.00 stop. The rule does not change; this run is a recorded exception. Speed does not change the computation"
      sweep: "peak LR from {6e-5, 2e-4, 6e-4}, each on the same 3% of the data with the same 5M-token warm-up; lowest held-out assistant-only loss wins; a diverged point is out"
      length: "3 epochs at most, checkpoint at each epoch; the checkpoint is chosen by held-out assistant-only loss, never by a benchmark. Stop early if held-out loss rises after an epoch"
      where: "SFT on one A100 PCIe 40 GB; instruct suite and G2 on the laptop in WSL2"
      speed_check: "first real packed steps on the A100 below 55k tok/s, counting token slots as M3 did: stop and report before the sweep (fixed-length M3 measurement: 78.6k tok/s median)"
    thresholds:
      gate_G2: "PASS if IFEval is above V1-Instruct 0.083 by more than 2 standard errors of the difference and training did not diverge. Reported with no pass line: IFEval against SmolLM2-135M-Instruct 0.220 and Gemma 3 270M-it 0.251, the rest of the instruct suite, XSTest, bits per byte"
      on_failure: "V2's chat arm is dropped from EXP-M4-T2D and its from-base route still runs. Written as stop and report; the owner removed the stop on 2026-11-03 (autonomous_run)"
      autonomous_run: "OWNER 2026-11-03, before any G2 or test result: Run the session no matter what. You need not wait for my approval. I want M4 to be completed autonomously. Session A, G2 and session B run in one queue on one server (scripts/cloud/m4_queue.py --session m). G2 runs IFEval only, on the server: its outputs are checked as text and never executed; the rest of the instruct suite and XSTest run on the laptop in WSL2 after. The standard error of the difference treats V2 and V1-Instruct (45 of 541) as independent proportions. A gate that cannot be measured has not passed, so the chat arm is dropped. The thresholds do not change"
      g2_result: "2026-11-04: PASSED, by the registered rule, in the queue. IFEval 0.1312 (71 of 541) against V1-Instruct 0.0832: difference 0.0481, standard error 0.0188, 2.56 standard errors. No divergence. Behind SmolLM2-135M-Instruct 0.220 and Gemma 3 270M-it 0.251, which have no pass line. Run 20261104T010206Z-eval-instruct-litegpt-final-15e8937, on the A100"
      sft_result: "2026-11-04: 3 epochs, 14,000 steps, peak LR 6e-4 (top of the grid: sweep held-out 1.5240, 1.4641, 1.4131). Held-out assistant-only loss 1.1323, 1.0518, 1.0238; epoch 3 chosen. No skipped steps. Mean 50.1k token slots per second"
      chat_bpb: "not evidence for V2-Instruct: it measures familiarity with this dataset family (see the note in docs/results.md); shown in tables, labelled as such"
      safety: "D5: a safety slice only if a cleanly licensed training source exists. Phase 0 found none, so none is planned; stated on the model card"
    conclusion: "DONE 2026-11-05. G2 PASSED on the A100 by the registered rule: IFEval 0.1312 (71 of 541) against V1-Instruct 0.0832, 2.56 standard errors, no divergence. 3 epochs, 14,000 steps, peak LR 6e-4, held-out assistant-only loss 1.1323, 1.0518, 1.0238, epoch 3 chosen. Rest of the suite on the laptop: IFEval 0.1294 (70 of 541, one question from the A100, so the machine difference is negligible), GSM8K chat 0.0220, HumanEval chat 0.0427, MBPP chat 0.0420, XSTest unsafe refused 0%, safe refused 0%. Beats V1-Instruct on IFEval, HumanEval and MBPP, level on GSM8K. Well behind SmolLM2-135M-Instruct (IFEval 0.220, MBPP 0.098) and Gemma 3 270M-it (0.251, 0.154). It has no safety behaviour, as D5 expected; that must be disclosed. Deviation: the speed check was below the 55k line (owner chose to continue, flash, micro-batch 8)."
  - id: EXP-M4-T2D
    milestone: M4
    hypothesis: "Fine-tuned on the same real text-to-data tasks by the same recipe, V2 is at least level with SmolLM2-135M and Gemma 3 270M on the mean of field F1, slot F1 and intent accuracy."
    config: benchmarks/m4/t2d.yaml (Phase 1)
    parent: EXP-M4-SFT
    status: done 2026-11-05
    runs: [every runs/*-train-m4-t2d-*-15e8937 and runs/*-train-m4-billsum-*-15e8937, results in runs/m4_t2d/test_results.json]
    decisions:   # PRE-REGISTERED 2026-11-03 before any fine-tune
      arms: "from base: V2 M3 final, SmolLM2-135M, Gemma 3 270M, Qwen3-0.6B-Base (reference only). From chat version: V2-Instruct, SmolLM2-135M-Instruct, Gemma 3 270M-it"
      tasks: "CUAD (document name, parties, agreement date, governing law), MASSIVE en-US slots, Banking77 intents; one model fine-tuned jointly on the three primary tasks. BillSum separately, on each model's chosen route, one seed, last"
      sources: "cuad a3c393f5 (master_clauses.csv -Answer columns, CUAD_v1.json text); massive refs/convert/parquet ed58ac42; banking77 18469841; billsum 3d851044"
      splits: "hashes in benchmarks/m4/t2d_manifest.json, committed before any fine-tune. CUAD split by filer so that the same parties are not on both sides"
      overlap: "Rule set before the scan: remove any test item sharing a 13-word run with V2's training data; above 1%, stop and report. Measured over 20.7B tokens: CUAD 60 of 102, BillSum 741 of 1,044, MASSIVE 1 of 2,974, Banking77 0 of 3,080; standard wording, most of one CUAD or BillSum item matched 23.5%, longest run 90 words. OWNER DECISION 2026-11-03: remove only items with a longest run of at least 30 words or at least 10% matched, for every model. Test items after removal: CUAD 98, MASSIVE 2,973, Banking77 3,080, BillSum 1,001, then 1,000 by context_removal. This relaxes the earlier rule; the cut-offs were chosen after seeing overlap figures and before any model output. Runs are pooled across documents, so they are upper limits. Rival models' overlap cannot be measured"
      context_removal: "Phase 1, before any model output: a prompt plus 256 new tokens must fit every model. One BillSum test item (test1834, a tariff bill of 4,072 V2 tokens in 5,373 characters) does not fit V2's 4,096 context, so it is removed for every model. BillSum test: 1,000 items, 302 of them zero-match. All other items of all four tasks fit (benchmarks/m4/t2d_manifest.json, the project's private logs)"
      cuad_input: "whitespace normalised, first 3,000 characters plus a 1,500-character window around the last governing-law keyword after them, or the end of the contract if there is none. Limits are in characters so every model reads the same bytes"
      prompts: "fixed in litegpt/t2d.py (INSTRUCTIONS, ANSWER_CUE) on 2026-11-03, before any fine-tune. Base arms: the same user text, then a cue, with the model's own BOS if it has one and its end token after the answer. Chat arms: the same user text through the model's own template, including SmolLM2's default system line"
      output: "CUAD: one JSON object, null for an absent field. MASSIVE: JSON list of {type, value}, empty when there are no slots. Banking77: the label name. Prompts are fixed in the config before the first real fine-tune and not changed after"
      recipe: "whole model, AdamW, loss on output tokens only, 3 epochs, batches of up to 32 examples and up to 16,000 characters, linear warm-up over 5% of steps then cosine to 10% of peak. Micro-batch may differ between models only to fit memory; the effective batch does not, and each target token weighs the same (tested). Fixed in benchmarks/m4/t2d.yaml before any fine-tune: weight decay 0.01 on 2-D weights only, betas 0.9 and 0.999, gradient clip 1.0, bf16 autocast, fp32 weights in training, bf16 weights in scoring"
      learning_rate: "per arm from {1e-5, 3e-5, 1e-4}, chosen on dev only with the same warm-up as the real run; the grid run at the chosen rate counts as the first seed; 2 more seeds"
      route: "each model's better route is chosen on dev only, by the mean over its seeds"
      decoding: "greedy, at most 256 new tokens, no JSON grammar help in the primary score"
      where: "all fine-tunes and dev scoring on one A100 PCIe 40 GB. Test scoring moves to the laptop if the A100 is under 1.5x the laptop's generation speed on the same dev scoring job; every model uses the same machine for test scoring. CPU numbers on the laptop"
      left_out_rule: "OWNER 2026-11-03, no one waits: a fine-tune, learning-rate choice or BillSum run that fails gets a second try and is then left out with a record, and the others go on. A grid point left out is out, as a diverged point is. A model with no finished route is left out of the comparison, and the results say so. The gate, routes, test scoring and backups are not tolerated: their failure stops the queue and the guard handles it"
      test_machine_result: "2026-11-04: A100 272.2 s, laptop 241.42 s on the same job: ratio 0.89, under 1.5, so every model's test scoring moves to the laptop"
      test_machine_rule: "the registered 1.5x rule runs by itself: the laptop's job took 241.42 s on starting V2 weights, all 3,087 dev items; the same job runs on the A100 before the fine-tunes. If the A100 is slower than that rule allows, or the job fails, test scoring waits for the laptop and the queue goes on to BillSum"
      budget: "guard stops at $9.00 or balance minus $1, across M4. Cut order if the projection passes the stop: SFT at 2 epochs, BillSum, the Qwen3 arm; then stop and ask. V2 and rival arms, their seeds and test scoring are never cut. A cut is decided from time and money only, never from scores"
    thresholds:
      score: "text-to-data score = plain mean of CUAD field micro-F1, MASSIVE slot micro-F1 and Banking77 accuracy. Normalisation: lowercase, punctuation removed, whitespace collapsed. Invalid JSON: every field in that output counts as missed; text after one complete JSON value is ignored. A correct null earns and costs nothing; an invented value is a false positive. Banking77 is exact after normalisation. JSON validity reported separately. BillSum ROUGE-L reported only"
      decision: "test scored once, after every route is chosen. Paired bootstrap over test items, seeds averaged, seed spread shown. Against each rival: win if ahead by more than 2 standard errors, loss if behind by more than 2, otherwise tie; also per task"
      strict_check: "the score and each comparison are also reported on zero-match test items only (CUAD 42, MASSIVE 2,973, Banking77 3,080; BillSum 302), next to the main score. The decision above uses the main score"
      headline: "win or tie and faster or smaller on CPU: a credible private text-to-data base, stated with its numbers. Tie and slower: as accurate, with the speed cost. Loss to either: publish it, recommend the winner for this job, and rest V2's case on reproducibility only"
      deviation: "a recipe change after seeing test scores voids the comparison and is recorded as a deviation"
    conclusion: "DONE 2026-11-05: HYPOTHESIS REJECTED. Test scored once, on the laptop by the registered rule. Score, mean of 3 seeds: V2 0.7999, SmolLM2-135M 0.8172, Gemma 3 270M 0.8220, Qwen3-0.6B reference 0.8507. V2 lost to each by more than 2 SE: -0.0173 (3.4 SE), -0.0221 (4.6 SE), -0.0508 (9.2 SE). No win on any task or on the zero-match items: on zero-match items V2 0.7758 ties SmolLM2 0.7893 (1.6 SE) and loses to Gemma 0.7911 (2.1 SE) and Qwen3 0.8341. Routes chosen on dev: V2 base, SmolLM2 chat, Gemma base, Qwen3 base. CPU at 8 threads, reported: V2 is slower than Gemma on all three tasks and than SmolLM2 on two; peak RAM V2 1.66 GiB, SmolLM2 1.61, Gemma 2.62, Qwen3 4.27. BillSum, reported only, ROUGE-L: V2 0.429, Gemma 0.442, SmolLM2 0.448, Qwen3 0.482. Headline by the registered rule, a loss to either rival: publish it, recommend the winner for this job, rest V2's case on full reproducibility only. Exploratory and not registered: Gemma against SmolLM2 from the saved predictions is a tie (+0.0047, 1.0 SE), so neither rival is the single winner. Limits: rivals may have seen these public datasets in pretraining and that cannot be measured; both V2 routes and both SmolLM2 routes chose the top of the learning-rate grid, and Gemma and Qwen3 the bottom. Nothing was changed after seeing test scores. No run left out. Test scoring was interrupted once before any score existed and resumed from saved outputs."
  - id: EXP-M5-EXPORT
    milestone: M5
    hypothesis: "Exported to the Hugging Face Qwen3 layout, each V2 model gives the same outputs through Transformers as through LiteGPT's own code."
    config: litegpt/export/to_hf.py
    parent: EXP-M4-SFT
    status: registered 2026-11-05 before any export; the owner asked for the export the same day
    runs: []
    decisions:   # PRE-REGISTERED 2026-11-05 before any export
      models: "LiteGPT-V2-Base from the M3 milestone-final.pt, LiteGPT-Llama-V2-Instruct from the M4 SFT milestone-final.pt"
      format: "safetensors at bfloat16, the dtype every benchmark was scored at, with tied embeddings stored once; Qwen3 config, tokenizer, chat template, litegpt.json metadata, model card, notice and licence files"
      measured_on: "CPU in float32 for logits, using the bfloat16 weights both sides, so differences are not hidden by bf16 rounding; prompts of 1, 16, 512, 2,048 and 3,968 tokens from fixed-seed token ids"
      correction_before_measuring: "2026-11-05, on a tiny random model, before any real export: LiteGPT's .to(bfloat16) also rounds its RoPE tables, and Transformers keeps them in float32. That gave logit differences near 5e-4 and failed the round trip. The rule is about weights, so the check now rebuilds LiteGPT's tables in float32. Thresholds unchanged"
      reported_at_bfloat16: "logit difference and greedy agreement with both sides at bfloat16, as people will run it; no pass line"
    thresholds:
      parameters: "201,373,952 on both sides"
      logits: "PASS if the largest absolute logit difference on any prompt is at most 1e-3"
      greedy: "PASS if 64 new tokens with the KV cache are identical on the 16, 512 and 3,968 token prompts"
      tokenizer: "PASS if ids are identical on 200 validation-independent strings from docs/ and the chat template gives the ids of chat_template.render_ids"
      round_trip: "PASS if litegpt.load on the exported folder gives logits identical to the source checkpoint rounded to bfloat16"
      on_failure: "The release loads through the litegpt package only and says so. No remote code is added without asking the owner"
    conclusion: "not started"
