-M1B-SUITE."
  - id: EXP-M2-LADDER
    milestone: M2
    hypothesis: "Each V2 architecture change (ADR-005) improves or does not hurt bits-per-byte at proxy scale when applied one at a time; the 32k tokenizer and the code+math mixture have measurable, reported per-domain effects."
    config: benchmarks/ablation.py + litegpt/training/ + benchmarks/ladder/*.yaml
    parent: null
    status: done
    runs:
      - 20261012T212115Z-train-ladder-smoke-437c36f        # smoke (30 steps)
      - 20261012T212446Z-train-ladder-lrsweep-1e-3-437c36f
      - 20261012T223607Z-train-ladder-lrsweep-2e-3-437c36f
      - 20261012T234625Z-train-ladder-lrsweep-4e-3-437c36f
      - 20261013T011719Z-train-ladder-s1-seed1-25f66de
      - 20261013T121110Z-train-ladder-s1-seed2-25f54ba     # diverged (stability result, not a noise sample)
      - 20261013T185112Z-train-ladder-s1-seed3-0ae0112
      - 20261013T153152Z-train-ladder-s2-9a4c575
      - 20261013T220631Z-train-ladder-s3-0ae0112
      - 20261014T020420Z-train-ladder-s4-cd84a4f
      - 20261031T072647Z-train-ladder-s5-4778f1b
      - 20261031T104118Z-train-ladder-s6-4778f1b
      - 20261031T150559Z-train-ladder-s7-b81bbb8
      - 20261031T180536Z-train-ladder-s8a-b81bbb8
      - 20261031T210545Z-train-ladder-s8b-b81bbb8
    decisions:   # PRE-REGISTERED 2026-10-12 before any ladder run (owner-approved M2 plan)
      proxy: "about 32M non-embedding parameters (held within +-3% of step 1 by MLP width), context 2048, 1.0B tokens per run, identical optimizer / schedule / batch / data order for every step"
      steps:
        s1: "V1 architecture: 8L x 576, 9 heads MHA, GELU MLP hidden 2304, LayerNorm (no bias, eps 1e-5), learned positions, tied embeddings; GPT-2 tokenizer, FineWeb-Edu (proxy_gpt2_train); seeds 1 and 2"
        s2: "+ RoPE (theta 10000) instead of learned positions"
        s3: "+ RMSNorm (pre-norm and final) and per-head QK-norm before RoPE"
        s4: "+ SwiGLU MLP, hidden 1536 (parameter-matched)"
        s5: "+ GQA 9 query / 3 key-value heads, SwiGLU hidden 1792 (parameter-matched)"
        s6: "+ deep-thin: 18L x 384, 6 query / 2 key-value heads, SwiGLU hidden 1216 (= LiteGPT architecture at proxy scale)"
        s7: "+ LiteGPT 32k tokenizer, FineWeb-Edu only (LiteGPT tokens)"
        s8a: "+ full stable mixture (index proxy_1b)"
        s8b: "same as 8a without code and math (index proxy_1b_nocodemath) - the single registered mixture ablation"
      optimizer: "AdamW betas (0.9, 0.95), weight decay 0.1 on 2-D weights, gradient clipping 1.0, bf16 autocast, torch.compile, ~262k tokens per step (16 x 2048 x 8 accumulation)"
      schedule: "WSD: linear warmup over the first 1% of tokens, constant, then decay over the last 20% to 10% of the peak (1-sqrt shape)"
    thresholds:
      noise_floor: "s = |BPB(s1 seed 1) - BPB(s1 seed 2)| on val_text/web at the end of training"
      effect: "a step helps if web BPB drops by more than max(2s, 0.005), hurts if it rises by more than that, otherwise no measurable effect at proxy scale; steps 7-8 are judged per domain (web, synthetic, code, math, chat) with the same rule"
      adoption: "not automatic: results are evidence for ADR-005; a step that hurts is returned to the owner with the numbers"
      validity: "invalid if training diverges (non-finite loss, or a spike > 10% above the running minimum that does not recover within 1% of the run), throttles thermally for > 5% of its time, or deviates from the shared configuration"
      proxy_lr: "sweep 1e-3, 2e-3, 4e-3 on s1 seed 1 for 0.25B tokens each (same schedule shape); lowest val_text/web BPB wins, ties within 0.002 go to the lower LR; the winner is used for every ladder step"
    clarifications:   # recorded 2026-10-12 BEFORE any ladder result (the first smoke run produced no step)
      - "Micro-batch: 16 x 2048 with the GPT-2 vocabulary (50,304) does not fit in the 16 GiB laptop GPU next to the AdamW state; the first smoke run spilled into shared memory (WDDM, also under WSL2) and was stopped before its first step. The loop now caps the CUDA allocator (free VRAM minus 1 GiB) and probes one forward/backward at the configured micro-batch before training, halving it and doubling the accumulation until it fits (s1: 8 x 2048 x 16 accumulation, probe peak 7.55 GiB). Tokens per step (262,144), block order, optimizer and schedule are unchanged (accumulation equals the large batch: tests/test_training.py); the micro-batch actually used and the probe are recorded in each run (run.json micro_batch_probe / micro_batch_used, train_summary.json)."
      - "Evaluation memory: the three proxy LR sweep runs trained to their last step (953/953) but the final token-level evaluation ran out of memory under the VRAM cap (float32 logits of the whole 8 x 2048 x 50k batch, 3 GiB), so no summary was written and the pipeline stopped (2026-10-13 00:56 UTC). The validation cross-entropy is now computed one sequence at a time (identical values: tests/test_training.py::test_token_nll_row_by_row_equals_batched); the runs resume bit-exactly from their last checkpoints. Recorded before any sweep result was read for selection."
      - "Micro-batch for s7, s8a, s8b (recorded 2026-10-31 before s7 started, owner-approved): s6, the first step on the LiteGPT model code, probed 16, 8, 4, 2 as out of memory and trained at 1 x 2048 x 128 accumulation (probe peak 12.51 GiB, which is absolute and includes memory left by the failed attempts; the running job at micro-batch 1 uses ~5.9 GB). Measured with small tensors, the s6 LiteGPT proxy and the s5 ablation model need the same memory per sequence (eager T=512: 582 vs 538 MiB; compiled B=4/2/1: 1,221/503/319 vs 1,195/512/375 MiB), so micro-batch 1 is a probe artefact, not a model requirement. s7, s8a and s8b therefore start the probe at 8 x 16 (the micro-batch every run s1-s5 used) instead of 16 x 8; the probe still halves if 8 does not fit. Tokens per step (262,144), block order, optimizer and schedule are unchanged, so results stay comparable with s1-s6 (s6 at 1 x 128 included); only throughput differs, and s6's throughput is not compared with the other steps."
    protocol_corrections:   # recorded 2026-10-13 after s1 seed 2 finished and before any later step's final result (owner-approved)
      - date: 2026-10-13
        finding: "s1 seed 2 diverged during the learning-rate decay: gradient norms rose from ~0.4 to 7-20 from step ~3,440 and stayed there, training loss rose from 3.67 to 3.95, and the final web BPB (1.2035) was worse than its own 900M-token value (1.1532); seed 1 finished at 1.1089 with a maximum post-warmup gradient norm of 0.61. The pre-registered spike rule (loss > 10% above its running minimum) did not trigger (+7.8%). Taken as seed noise, the noise floor would be s = 0.0946 and the effect threshold 0.189, which no plausible architecture step can pass; the noise-floor rule assumed two stable runs. (Resume after the WSL restart at step 327 reproduced the 100M-token evaluation to within 0.0002 web BPB, so the resume is not implicated.)"
        correction: "Divergence rule for every M2 run: a run has diverged if its logged gradient norm exceeds 10x the median of its earlier post-warmup logged values for logged points covering more than 1% of its steps (litegpt/training/stability.py, tested). Applied to all finished runs: s1 seed 2 diverged (8.5% of steps, max 51x), proxy LR sweep 4e-3 diverged (3.2%, max 48x; it was not selected), all others stable (max <= 2.6x). A diverged run is reported as a stability result, not used as a noise sample. s1 seed 3 is added (same configuration, seed 3) and the noise floor is s = |web BPB(s1 seed 1) - web BPB(s1 seed 3)|; if seed 3 also diverges, the owner decides before any step is judged. Each step's divergence result is reported next to its BPB (the steps without QK-norm, s1 and s2, are where attention-logit growth would show)."
    protocol_deviations:   # recorded AFTER the affected runs (a deviation, not a pre-recorded correction); owner-approved 2026-11-01
      - date: 2026-11-01
        rule: "validity: 'invalid if ... throttles thermally for > 5% of its time'"
        affected: "proxy LR sweep 1e-3 / 2e-3 / 4e-3 (95.1% / 95.1% / 95.0% of busy seconds), s1 seed 1 (82.3%), s4 (20.8%, all of it in a 50-minute battery segment where the driver limits the GPU and reports a thermal clock event); every other M2 run 0-2.7%"
        decision: "The runs stand. Thermal throttling lowers the clock, not the values a run computes (same kernels, data order and optimizer state), so the rule is applied as a reported health check rather than an invalidity condition; throttle shares stay in the report next to each run."
    conclusion: "DONE (2026-11-01). Proxy LR: 2e-3 (web BPB at 0.25B: 1e-3 1.5672, 2e-3 1.4542, 4e-3 1.9922 and diverged). Noise floor s = |1.1089 - 1.1102| = 0.0013 (s1 seeds 1 and 3; seed 2 diverged, 1.2035), effect threshold 0.005. Web BPB per step, change vs the previous step: s1 1.1096 (mean of seeds 1 and 3); s2 +RoPE 1.0750 (-0.0346, helps); s3 +RMSNorm/QK-norm 1.0640 (-0.0110, helps); s4 +SwiGLU 1.0609 (-0.0031, no measurable effect); s5 +GQA 1.0593 (-0.0016, no measurable effect); s6 +deep-thin 1.0599 (+0.0007, no measurable effect; micro-batch 1 x 128, results comparable); s7 +32k tokenizer 1.0632 (web +0.0033, no measurable effect; synthetic +0.058, code +0.125, math +0.116, chat +0.067 vs s6: hurts; FineWeb-Edu only, so the code/math vocabulary was barely trained); s8a +full mixture vs s7 (web 1.0958 +0.0326 hurts; synthetic 0.7457 -0.262, code 0.7123 -1.183, math 1.1550 -0.439, chat 1.0295 -0.105: help); s8b mixture without code and math (web 1.0674, +0.0042 vs s7: no measurable effect), so s8a's web cost is code and math taking token budget (web share 65% vs 86%), not the textbooks. Stability: every run s2-s8b stable (max gradient-norm ratio <= 2.87x); the V1 architecture (s1) diverged in 1 of 3 seeds. OWNER DECISIONS (2026-11-01): (1) adopt the full mixture (s8a); goal: balanced with a code specialisation, judged on numbers: core BPB (registered val_core weights) s8a 1.0188 / s8b 1.1057 / s7 1.2278, equal-weight five-domain mean 0.948 / 1.108 / 1.339, worst domain vs the best of the three +4.5% synthetic / +91% code / +166% code; (2) keep the LiteGPT 32k tokenizer (frozen in M1; owner decision 2026-11-01 to stay at 32k); (3) the GQA code watch item (s5 code +0.081) is closed: not seen again in s6 or s8a; (4) the thermal-rule deviation above. Evidence for ADR-005."
