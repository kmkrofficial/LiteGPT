[project]
name = "litegpt"
version = "2.0.0.dev0"
description = "LiteGPT V2: a small, independently implemented, modern GPT-style language model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# core = what inference needs. Pins mirror docs/spec/v2.yaml (environment.pins); see ADR-006.
dependencies = [
    "torch==2.14.1",
    "tokenizers==0.23.2",
    "safetensors==0.8.0",
    "numpy==2.5.3",
]

[project.scripts]
litegpt = "litegpt.cli:main"

[dependency-groups]
train = ["datasets==5.1.0", "matplotlib==3.11.2", "pyyaml", "nvidia-ml-py"]
eval = ["lm-eval==0.4.13", "transformers==5.18.0", "datasets==5.1.0"]
hf = ["transformers==5.18.0"]
# Optional cross-check tools only (e.g. verify our DPO loss against TRL on the HF export).
# The V2 architecture and training loop do not depend on them.
hf-reference = ["trl==1.14.1", "peft==0.21.2", "accelerate==1.15.0"]
dev = ["pytest", "pyyaml"]
# Optional (ADR-006): community prebuilt flash-attn 2.8.3 wheels (cu130 / torch 2.14 / cp312) for Windows and Linux x86_64
# (WSL2). Install with `uv sync --locked --group flash`. SDPA is used whenever flash-attn is absent.
flash = ["flash-attn; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.23"
default-groups = ["dev", "train", "hf"]
prerelease = "disallow"

[tool.uv.build-backend]
module-root = ""
module-name = "litegpt"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.2/flash_attn-2.8.3+cu130torch2.14-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.0/flash_attn-2.8.3+cu130torch2.14-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
