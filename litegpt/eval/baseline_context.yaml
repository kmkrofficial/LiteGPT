# Published context for the M1b baselines (EXP-M1B-BASELINES). These are the publishers' figures, shown in the report as
# "published", never as measurements. Parameter counts are NOT typed here: the report counts them from the loaded weights
# (efficiency records). Checked 2026-10-12 against each model card at the evaluated revision.
# order: report row order (V1 first, then by size).
